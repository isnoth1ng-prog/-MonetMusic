name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selecting Xcode at $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Install Xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          set -o pipefail
          xcodebuild clean build             -project Rhythm.xcodeproj             -scheme Rhythm             -configuration Release             -sdk iphoneos             CONFIGURATION_BUILD_DIR=$PWD/build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO > build.log 2>&1

      - name: Print Build Log on Failure
        if: failure()
        run: |
          tail -n 250 build.log

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/Rhythm.app Payload/
          zip -r Rhythm.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Rhythm-IPA
          path: Rhythm.ipa
